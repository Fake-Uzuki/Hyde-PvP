# HYDE PVP Verification & Scoreboard Sync Plugin Configuration
# Set this to your live website domain.
web_api_url: "https://hyde-pvp.onrender.com/api/server/verify-player"
sync_rankings_url: "https://hyde-pvp.onrender.com/api/server/sync-rankings"

# Secret key that matches HYDE_SERVER_KEY in your website .env
server_key: "hyde-pvp-secret-key-19015"

# Scoreboard objective names to read from PocketMine
kills_objective: "kills"
points_objective: "points"
deaths_objective: "deaths"

# Automatic sync interval in minutes
sync_interval_minutes: 5
